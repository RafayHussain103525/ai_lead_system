services:
  valkey:
    image: valkey/valkey:7-alpine
    ports: ["6379:6379"]
    command: valkey-server --appendonly yes
    volumes: [valkey_data:/data]
    networks: [ai_net]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
    networks: [ai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    ports: ["8080:8080"]
    env_file: .env
    environment: &backend_env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VALKEY_URL=redis://valkey:6379/0
      - RATELIMIT_STORAGE_URI=redis://valkey:6379/1
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      valkey: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [ai_net]

  worker:
    build: ./backend
    command: rq worker --url redis://valkey:6379/0
    env_file: .env
    environment: *backend_env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      valkey: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [ai_net]
    deploy:
      replicas: 3

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app          
      - /app/node_modules
    networks: [ai_net]

networks:
  ai_net: {driver: bridge}
volumes:
  valkey_data:
  pg_data:
  uploads_data: