
services:
  valkey:
    image: valkey/valkey:7-alpine
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    volumes:
      - valkey_data:/data
    networks:
      - ai_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 5
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    networks:
      - ai_net

  n8n:
    image: docker.n8n.io/n8nio/n8n

    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://localhost:5678/
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai_net

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - valkey
    networks:
      - ai_net

  worker:
    build: ./backend
    command: rq worker --url redis://valkey:6379/0
    deploy:
      replicas: 3 
    depends_on:
      - valkey
      - n8n
    networks:
      - ai_net

  frontend:
    build: ./frontend
    ports:
      - "5173:5173" 
    networks:
      - ai_net

networks:
  ai_net:
    driver: bridge

volumes:
  valkey_data:
  n8n_data: 